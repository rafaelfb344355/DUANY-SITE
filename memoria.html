<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081733">
<title>Memória do Tesouro 🐚</title>
<style>
:root{--bg1:#081733;--bg2:#1e40af;--gold:#f2c14e;--gold2:#c8971f;--pale:#fbe4a8;--foam:#eaf1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Trebuchet MS','Segoe UI',sans-serif;color:var(--foam);
background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;
padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{display:flex;flex-direction:column;align-items:center;padding:16px 14px;min-height:100vh}
h1{margin:6px 0 12px;font-size:24px;color:var(--gold)}
.hud{display:flex;gap:8px;width:100%;max-width:420px;margin-bottom:14px}
.chip{flex:1;text-align:center;background:rgba(8,23,51,.55);border:1px solid rgba(242,193,78,.4);border-radius:14px;padding:8px 4px}
.chip small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.chip b{font-size:18px;color:var(--pale)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px}
.card{aspect-ratio:3/4;perspective:600px;cursor:pointer;border:0;background:none;padding:0}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold)}
.b{background:repeating-linear-gradient(45deg,#132a63,#132a63 8px,#1a3a85 8px,#1a3a85 16px);color:var(--gold);font-size:26px}
.f{background:#fff7e0;transform:rotateY(180deg)}
.card.done .f{background:#ffe9a8;box-shadow:0 0 14px rgba(242,193,78,.7)}
.f svg{width:78%;height:78%}
.ov{position:fixed;inset:0;background:rgba(8,23,51,.94);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov.hide{display:none}
.panel{max-width:340px;width:100%;text-align:center;background:rgba(11,21,48,.8);border:1px solid rgba(242,193,78,.4);border-radius:22px;padding:28px 22px}
.panel h2{color:var(--gold);margin:0 0 10px}.panel p{font-size:14px;line-height:1.5;margin:0 0 16px;opacity:.9}
.btn{border:0;width:100%;padding:14px;border-radius:999px;font-weight:800;font-size:16px;color:#081733;cursor:pointer;
background:linear-gradient(135deg,var(--pale),var(--gold) 55%,var(--gold2))}
.rec{background:var(--gold);color:#081733;font-weight:800;border-radius:10px;padding:8px;margin-bottom:12px;display:none}
.rec.show{display:block}
.home{position:fixed;top:max(6px,env(safe-area-inset-top));left:8px;z-index:20;text-decoration:none;color:#fbe4a8;font-weight:700;font-size:13px;background:rgba(8,23,51,.7);border:1px solid rgba(242,193,78,.5);border-radius:999px;padding:7px 12px}body{padding-top:calc(env(safe-area-inset-top) + 46px)!important}</style>
</head>
<body>
<a class="home" href="index.html">← Menu</a>
<h1>Memória do Tesouro 🐚</h1>
<div class="hud">
  <div class="chip"><small>Tempo</small><b id="t">0s</b></div>
  <div class="chip"><small>Jogadas</small><b id="m">0</b></div>
  <div class="chip"><small>Recorde</small><b id="r">–</b></div>
</div>
<div class="grid" id="grid"></div>

<div class="ov" id="ov">
  <div class="panel">
    <h2 id="ovT">Memória do Tesouro</h2>
    <div class="rec" id="rec">🏆 Novo recorde!</div>
    <p id="ovP">Encontre os 8 pares de baús, conchas, estrelas-do-mar e símbolos do código Pigpen no menor tempo e com poucas jogadas.</p>
    <button class="btn" id="go">Jogar</button>
  </div>
</div>

<script>
const C="#0a1f4d",G="#c8971f";
const st=(d,x="")=>`<svg viewBox="0 0 64 64" fill="none" stroke="${C}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${d}${x}</svg>`;
const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${C}" stroke="none"/>`;
const SYM=[
 `<svg viewBox="0 0 64 64"><rect x="8" y="26" width="48" height="28" rx="3" fill="#8a5a2a" stroke="#4a2c14" stroke-width="3"/><path d="M8 28q24-26 48 0z" fill="#a8702f" stroke="#4a2c14" stroke-width="3"/><rect x="8" y="34" width="48" height="6" fill="#f2c14e"/><circle cx="32" cy="37" r="4" fill="#c8971f" stroke="#4a2c14" stroke-width="2"/></svg>`,
 `<svg viewBox="0 0 64 64"><path d="M32 8c-18 0-26 16-22 30 3 10 12 16 22 16s19-6 22-16c4-14-4-30-22-30z" fill="#ffc9b0" stroke="#b5654a" stroke-width="3"/><path d="M32 10v44M20 14l4 40M44 14l-4 40M12 26l12 28M52 26L40 54" stroke="#b5654a" stroke-width="2.5" fill="none"/></svg>`,
 `<svg viewBox="0 0 64 64"><path d="M32 6l7.5 17.5 19 1.6-14.4 12.4 4.4 18.5L32 46 15.5 56l4.4-18.5L5.500 25.100l19-1.600z" fill="#ff8a5c" stroke="#b5452a" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="30" r="3" fill="#ffd2b8"/></svg>`,
 st(`<path d="M32 14v36M22 24h20M12 40q4 12 20 12t20-12"/><circle cx="32" cy="10" r="4"/>`),
 st(`<path d="M16 14h32v36"/>`),            // pigpen A-like corner
 st(`<rect x="14" y="14" width="36" height="36"/>`,dot(32,32)), // N
 st(`<path d="M16 18l16 16-16 16"/>`),     // pigpen T
 st(`<path d="M14 20l18 16 18-16"/>`,dot(32,26)) // pigpen Z
];
const K="memoria_rec";
const store={g(k){try{return localStorage.getItem(k)}catch(e){return this.m?.[k]??null}},
 s(k,v){try{localStorage.setItem(k,v)}catch(e){(this.m=this.m||{})[k]=v}}};
let rec=JSON.parse(store.g(K)||"null");
const $=id=>document.getElementById(id);
function showRec(){$("r").textContent=rec?rec.t+"s":"–"}
showRec();
let open=[],lock=false,moves=0,pairs=0,t0=0,timer;
function build(){
  const deck=[...SYM,...SYM].map((s,i)=>({s,sort:Math.random()})).sort((a,b)=>a.sort-b.sort);
  $("grid").innerHTML="";
  deck.forEach((c,i)=>{
    const b=document.createElement("button");b.className="card";b.dataset.k=SYM.indexOf(c.s);
    b.innerHTML=`<div class="in"><div class="b">✦</div><div class="f">${c.s}</div></div>`;
    b.onclick=()=>flip(b);$("grid").appendChild(b);
  });
}
function flip(b){
  if(lock||b.classList.contains("open")||b.classList.contains("done"))return;
  b.classList.add("open");open.push(b);
  if(open.length<2)return;
  moves++;$("m").textContent=moves;lock=true;
  const [a,c]=open;
  if(a.dataset.k===c.dataset.k){
    setTimeout(()=>{a.classList.replace("open","done");c.classList.replace("open","done");open=[];lock=false;
      if(++pairs===8)win()},400);
  }else setTimeout(()=>{a.classList.remove("open");c.classList.remove("open");open=[];lock=false},900);
}
function win(){
  clearInterval(timer);
  const t=Math.round((Date.now()-t0)/1000);
  let nr=false;
  if(!rec||t<rec.t||(t===rec.t&&moves<rec.m)){rec={t,m:moves};store.s(K,JSON.stringify(rec));nr=true}
  showRec();
  $("ovT").textContent="Tesouro encontrado! 🎉";
  $("ovP").textContent=`Você terminou em ${t}s com ${moves} jogadas. Recorde: ${rec.t}s (${rec.m} jogadas).`;
  $("rec").classList.toggle("show",nr);
  $("go").textContent="Jogar de novo";
  setTimeout(()=>$("ov").classList.remove("hide"),700);
}
$("go").onclick=()=>{
  $("ov").classList.add("hide");moves=0;pairs=0;open=[];lock=false;
  $("m").textContent=0;$("t").textContent="0s";build();
  t0=Date.now();clearInterval(timer);
  timer=setInterval(()=>$("t").textContent=Math.round((Date.now()-t0)/1000)+"s",250);
};
build();
</script>
</body>
</html>
